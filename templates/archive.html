<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.R.C.H.I.V.E. — Project ERIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Mono', 'Courier New', monospace;
      background: #EFEFEF;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem;
      transition: background 0.2s, color 0.2s;
    }
    body.dark { background: #0D0D0D; color: #4ADB4A; }
    .container { max-width: 680px; margin: 0 auto; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
    .version { font-size: 11px; color: #888; margin: 0 0 16px; letter-spacing: 0.08em; }
    body.dark .version { color: #2A4A2A; }
    .wordmark { font-size: 24px; font-weight: 500; margin: 0 0 4px; letter-spacing: 0.08em; }
    .subtitle { font-size: 12px; color: #666; margin: 0; letter-spacing: 0.04em; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body.dark .subtitle { color: #3A7A3A; }
    .mode-toggle {
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      border: 0.5px solid #ccc;
      color: #888;
      font-family: 'SF Mono', 'Fira Mono', monospace;
      margin-top: 4px;
      flex-shrink: 0;
    }
    body.dark .mode-toggle { border-color: #2A2A2A; color: #3A7A3A; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .filter-row input {
      flex: 1;
      font-size: 13px;
      padding: 7px 12px;
      border: 0.5px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      outline: none;
      min-width: 160px;
    }
    body.dark .filter-row input { background: #111; border-color: #2A2A2A; color: #4ADB4A; }
    .type-btn {
      font-size: 11px;
      padding: 7px 12px;
      border: 0.5px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      letter-spacing: 0.06em;
      font-family: 'SF Mono', 'Fira Mono', monospace;
    }
    .type-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    body.dark .type-btn { background: #111; border-color: #2A2A2A; color: #3A7A3A; }
    body.dark .type-btn.active { background: #1A3A1A; color: #4ADB4A; border-color: #2A6A2A; }
    .section-label { font-size: 11px; color: #aaa; margin: 0 0 10px; letter-spacing: 0.08em; }
    body.dark .section-label { color: #2A4A2A; }
    .doc-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
    .doc-card {
      background: #fff;
      border-radius: 6px;
      border: 0.5px solid #ddd;
      border-left: 2px solid #888;
      padding: 0.875rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    body.dark .doc-card { background: #111; border-color: #1A1A1A; border-left-color: #2A6A2A; }
    .doc-card .info { min-width: 0; }
    .doc-card .title {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body.dark .doc-card .title { color: #4ADB4A; }
    .doc-card .meta { font-size: 11px; color: #aaa; margin: 0; letter-spacing: 0.04em; }
    body.dark .doc-card .meta { color: #2A5A2A; }
    .doc-card .actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .doc-card .actions a, .doc-card .actions button {
      font-size: 11px;
      padding: 4px 10px;
      border: 0.5px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: inherit;
      font-family: 'SF Mono', 'Fira Mono', monospace;
    }
    body.dark .doc-card .actions a,
    body.dark .doc-card .actions button { background: #111; border-color: #2A2A2A; color: #3A7A3A; }
    .doc-card .actions a:hover, .doc-card .actions button:hover { background: #f5f5f5; }
    body.dark .doc-card .actions a:hover,
    body.dark .doc-card .actions button:hover { background: #161616; }
    .footer {
      padding-top: 1rem;
      border-top: 0.5px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    body.dark .footer { border-color: #1A1A1A; }
    .footer a { font-size: 11px; color: #aaa; text-decoration: none; letter-spacing: 0.06em; }
    body.dark .footer a { color: #2A5A2A; }
    .footer .stats { font-size: 11px; color: #aaa; letter-spacing: 0.06em; }
    body.dark .footer .stats { color: #2A4A2A; }
    .empty { font-size: 13px; color: #aaa; padding: 1rem 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <div>
        <p class="version">PROJECT ERIS v0.1.0 — LOCAL BUILD</p>
        <p class="wordmark">A.R.C.H.I.V.E.</p>
        <p class="subtitle">Aggregated Reference Collection: Housed in an Indexed Vault for Evidence</p>
      </div>
      <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">DARK</button>
    </div>

    <div class="filter-row">
      <input type="text" id="search-input" placeholder="Search by author, title, filename..." oninput="filterDocs()" />
      <button class="type-btn active" onclick="setType('ALL', this)">ALL</button>
      <button class="type-btn" onclick="setType('BOOK', this)">BOOK</button>
      <button class="type-btn" onclick="setType('ARTICLE', this)">ARTICLE</button>
      <button class="type-btn" onclick="setType('DOCUMENT', this)">DOC</button>
    </div>

    <p class="section-label" id="section-label">── LOADING ──────────────────────────────────</p>
    <div class="doc-list" id="doc-list"></div>

    <div class="footer">
      <a href="/">← ERIS</a>
      <span class="stats" id="stats"></span>
    </div>
  </div>

  <script>
    var allDocs = [];
    var currentType = "ALL";
    var dark = localStorage.getItem("eris-dark") === "true";
    if (dark) applyDark();

    function toggleMode() {
      dark = !dark;
      localStorage.setItem("eris-dark", dark);
      if (dark) applyDark(); else applyLight();
    }

    function applyDark() {
      document.body.classList.add("dark");
      document.getElementById("mode-toggle").textContent = "LIGHT";
    }

    function applyLight() {
      document.body.classList.remove("dark");
      document.getElementById("mode-toggle").textContent = "DARK";
    }

    function setType(type, btn) {
      currentType = type;
      document.querySelectorAll(".type-btn").forEach(function(b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      filterDocs();
    }

    function filterDocs() {
      var query = document.getElementById("search-input").value.toLowerCase();
      var filtered = allDocs.filter(function(doc) {
        var matchType = currentType === "ALL" || doc.doc_type === currentType;
        var matchQuery = !query ||
          doc.title.toLowerCase().includes(query) ||
          doc.author.toLowerCase().includes(query) ||
          doc.filename.toLowerCase().includes(query);
        return matchType && matchQuery;
      });
      renderDocs(filtered);
    }

    function renderDocs(docs) {
      var list = document.getElementById("doc-list");
      var label = document.getElementById("section-label");
      list.innerHTML = "";

      var dashes = "────────────────────────────────────────────";
      label.textContent = "── " + docs.length + " DOCUMENT" + (docs.length !== 1 ? "S" : "") + " " + dashes.slice(0, 44 - docs.length.toString().length - 11);

      if (docs.length === 0) {
        list.innerHTML = "<p class='empty'>No documents match your search.</p>";
        return;
      }

      docs.forEach(function(doc) {
        var card = document.createElement("div");
        card.className = "doc-card";
        var author = doc.author || "unknown";
        var pages = doc.pages ? " · " + doc.pages + " pp" : "";
        card.innerHTML =
          "<div class='info'>" +
          "<p class='title'>" + (doc.title || doc.filename) + "</p>" +
          "<p class='meta'>" + doc.doc_type + " · " + author + pages + "</p>" +
          "</div>" +
          "<div class='actions'>" +
          "<a href='/archive/view/" + encodeURIComponent(doc.filename) + "' target='_blank'>VIEW</a>" +
          "<a href='/archive/download/" + encodeURIComponent(doc.filename) + "'>↓</a>" +
          "</div>";
        list.appendChild(card);
      });
    }

    fetch("/archive/documents")
      .then(function(res) { return res.json(); })
      .then(function(data) {
        allDocs = data.documents;
        document.getElementById("stats").textContent =
          data.total + " DOCUMENTS · " + data.chunks + " CHUNKS";
        filterDocs();
      })
      .catch(function() {
        document.getElementById("section-label").textContent = "── ERROR LOADING DOCUMENTS ──────────────────";
      });
  </script>
</body>
</html>
