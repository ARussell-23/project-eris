<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.U.I.D.E. — Project ERIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #EFEFEF; color: #1a1a1a; min-height: 100vh;
      padding: 2rem; transition: background 0.2s, color 0.2s;
    }
    body.dark { background: #0D0D0D; color: #4ADB4A; }
    .container { max-width: 680px; margin: 0 auto; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
    .header .label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 11px; color: #888; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 6px;
    }
    body.dark .header .label { color: #2A4A2A; }
    .header .wordmark {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 24px; font-weight: 500; letter-spacing: 0.06em; margin-bottom: 4px;
    }
    body.dark .header .wordmark { color: #4ADB4A; }
    .header .subtitle { font-size: 12px; color: #666; letter-spacing: 0.02em; }
    body.dark .header .subtitle { color: #3A7A3A; }
    .mode-toggle {
      font-size: 11px; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 4px;
      cursor: pointer; background: transparent; border: 0.5px solid #ccc; color: #888;
      font-family: "SF Mono", "Fira Mono", monospace; margin-top: 4px; flex-shrink: 0;
    }
    body.dark .mode-toggle { border-color: #2A2A2A; color: #3A7A3A; }
    .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .search-row input {
      flex: 1; font-size: 14px; padding: 8px 12px; border: 0.5px solid #ccc;
      border-radius: 6px; outline: none; background: #fff; color: #1a1a1a;
    }
    body.dark .search-row input { background: #111; border-color: #2A2A2A; color: #4ADB4A; }
    .search-row input:focus { border-color: #999; }
    body.dark .search-row input:focus { border-color: #2A6A2A; }
    .search-row button {
      font-size: 13px; padding: 8px 16px; border: 0.5px solid #ccc;
      border-radius: 6px; background: #fff; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    body.dark .search-row button { background: #111; border-color: #2A2A2A; color: #3A7A3A; }
    .search-row button:hover { background: #f5f5f5; }
    body.dark .search-row button:hover { background: #161616; }
    .searching { font-size: 13px; color: #888; margin-bottom: 1rem; display: none; }
    body.dark .searching { color: #3A7A3A; }
    .status { font-size: 13px; color: #666; margin-bottom: 1rem; min-height: 20px; }
    body.dark .status { color: #3A7A3A; }
    .guide-response {
      font-size: 13px; color: #444; margin-bottom: 1.25rem;
      line-height: 1.6; white-space: pre-wrap; min-height: 0;
    }
    body.dark .guide-response { color: #3A7A3A; }
    .cursor {
      display: inline-block; width: 8px; height: 14px;
      background: #888; vertical-align: -2px;
      animation: blink 1s step-start infinite;
    }
    body.dark .cursor { background: #3A7A3A; }
    @keyframes blink { 50% { opacity: 0; } }
    .results { display: flex; flex-direction: column; gap: 8px; }
    .result-card {
      background: #fff; border-radius: 6px; border: 0.5px solid #ddd;
      border-left: 2px solid #888; padding: 0.875rem 1rem;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    body.dark .result-card { background: #111; border-color: #1A1A1A; border-left-color: #2A6A2A; }
    .result-card .meta { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
    body.dark .result-card .meta { color: #4ADB4A; }
    .result-card .snippet {
      font-size: 13px; color: #666; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    body.dark .result-card .snippet { color: #2A5A2A; }
    .result-card .page-btn {
      font-size: 13px; padding: 4px 10px; border: 0.5px solid #ddd;
      border-radius: 4px; background: #fff; cursor: pointer;
      flex-shrink: 0; color: #444; text-decoration: none; display: inline-block;
    }
    body.dark .result-card .page-btn { background: #111; border-color: #2A2A2A; color: #3A7A3A; }
    .result-card .page-btn:hover { background: #f5f5f5; }
    body.dark .result-card .page-btn:hover { background: #161616; }
    .footer {
      margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid #ddd;
      display: flex; justify-content: space-between; align-items: center;
    }
    body.dark .footer { border-color: #1A1A1A; }
    .footer a { font-size: 11px; color: #aaa; text-decoration: none; letter-spacing: 0.06em; font-family: "SF Mono", "Fira Mono", monospace; }
    body.dark .footer a { color: #2A5A2A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <div class="header">
        <p class="label">project eris</p>
        <p class="wordmark">G.U.I.D.E.</p>
        <p class="subtitle">Guided Understanding through Indexed Document Exploration</p>
      </div>
      <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">DARK</button>
    </div>

    <div class="search-row">
      <input type="text" id="query-input" placeholder="What are you looking for?" />
      <button onclick="runSearch()">
        <i class="ti ti-search"></i>
        Search
      </button>
    </div>

    <div class="searching" id="spinner">searching...</div>
    <div class="status" id="status"></div>
    <div class="guide-response" id="guide-response"></div>
    <div class="results" id="results"></div>

    <div class="footer">
      <a href="/">← ERIS</a>
    </div>
  </div>

  <script>
    var dark = localStorage.getItem("eris-dark") === "true";
    if (dark) applyDark();

    function toggleMode() {
      dark = !dark;
      localStorage.setItem("eris-dark", dark);
      if (dark) applyDark(); else applyLight();
    }
    function applyDark() {
      document.body.classList.add("dark");
      document.getElementById("mode-toggle").textContent = "LIGHT";
    }
    function applyLight() {
      document.body.classList.remove("dark");
      document.getElementById("mode-toggle").textContent = "DARK";
    }

    var queryInput = document.getElementById("query-input");
    var statusEl = document.getElementById("status");
    var responseEl = document.getElementById("guide-response");
    var resultsEl = document.getElementById("results");
    var spinner = document.getElementById("spinner");
    var currentSource = null;

    queryInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") runSearch();
    });

    function runSearch() {
      var query = queryInput.value.trim();
      if (!query) return;

      // Cancel any existing stream
      if (currentSource) {
        currentSource.close();
        currentSource = null;
      }

      // Clear previous results
      statusEl.textContent = "";
      responseEl.textContent = "";
      resultsEl.innerHTML = "";
      spinner.style.display = "block";

      // Add blinking cursor to response area
      var cursor = document.createElement("span");
      cursor.className = "cursor";
      responseEl.appendChild(cursor);

      // Open SSE stream
      currentSource = new EventSource("/search?q=" + encodeURIComponent(query));

      currentSource.onmessage = function(e) {
        var data = JSON.parse(e.data);

        if (data.type === "results") {
          // Show result cards immediately
          var results = data.results;
          if (results && results.length > 0) {
            statusEl.textContent = results.length + " source" + (results.length > 1 ? "s" : "") + " found";
            results.forEach(function(result) {
              var author = result.author ? ", " + result.author : "";
              var card = document.createElement("div");
              card.className = "result-card";
              var docUrl = "/archive/doc/" + encodeURIComponent(result.source_file) + "#page=" + result.page_number;
              card.innerHTML =
                "<div style='min-width:0'>" +
                "<p class='meta'>" + (result.title || result.source_file) + author + "</p>" +
                "<p class='snippet'>" + result.text + "</p>" +
                "</div>" +
                "<a class='page-btn' href='" + docUrl + "' target='_blank'>p. " + result.page_number + "</a>";
              resultsEl.appendChild(card);
            });
          } else {
            statusEl.textContent = "0 sources found";
          }
          spinner.style.display = "none";
        }

        else if (data.type === "token") {
          // Remove cursor, append token, re-add cursor
          var existingCursor = responseEl.querySelector(".cursor");
          if (existingCursor) existingCursor.remove();
          responseEl.appendChild(document.createTextNode(data.token));
          var newCursor = document.createElement("span");
          newCursor.className = "cursor";
          responseEl.appendChild(newCursor);
        }

        else if (data.type === "done") {
          // Remove cursor when done
          var finalCursor = responseEl.querySelector(".cursor");
          if (finalCursor) finalCursor.remove();
          currentSource.close();
          currentSource = null;
        }

        else if (data.type === "error") {
          var errCursor = responseEl.querySelector(".cursor");
          if (errCursor) errCursor.remove();
          statusEl.textContent = "Something went wrong — is Ollama running?";
          spinner.style.display = "none";
          currentSource.close();
          currentSource = null;
        }
      };

      currentSource.onerror = function() {
        var errCursor = responseEl.querySelector(".cursor");
        if (errCursor) errCursor.remove();
        spinner.style.display = "none";
        if (responseEl.textContent.trim() === "") {
          statusEl.textContent = "Something went wrong — is Ollama running?";
        }
        if (currentSource) {
          currentSource.close();
          currentSource = null;
        }
      };
    }
  </script>
</body>
</html>
